name: SeeThrough
options:
  bundleIdPrefix: com.slt
  deploymentTarget:
    iOS: "17.0"
targets:
  SeeThrough:
    type: application
    platform: iOS
    sources: [SeeThrough]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukadadiani.seethrough
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 5QC5886P5V
        CODE_SIGN_STYLE: Automatic
    info:
      path: SeeThrough/Info.plist
      properties:
        CFBundleDisplayName: Hive Vision
        NSCameraUsageDescription: The camera streams what you see and scans walls with LiDAR so other people can see through them.
        UIRequiredDeviceCapabilities: [arkit]
        UIAppFonts: [Doto.ttf, SpaceMono-Regular.ttf, SpaceMono-Bold.ttf]
        UILaunchScreen: { UIColorName: "" }
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
